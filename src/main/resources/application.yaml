logging:
  level:
    root: INFO
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint}%clr(%-5level){blue,INFO yellow,WARN red,ERROR}%clr([%thread]){cyan}%clr(%logger{36}){green} -%msg%n"
